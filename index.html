<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base" content="">
    <title>YouTube Video Downloader</title>
    <link rel="stylesheet" href="/src/assets/css/main.css?v=2">
</head>
<body>
    <header class="app-header">
        <div class="page-width">
            <h1>YouTube Video Downloader</h1>
            <span class="local-badge">Local app</span>
        </div>
    </header>

    <main class="page-width">
        <section class="download-panel" aria-labelledby="page-heading">
            <div class="panel-heading">
                <p class="eyebrow">VIDEO DOWNLOADER</p>
                <h2 id="page-heading">Choose a video</h2>
                <p>Paste a YouTube video URL to view available download formats.</p>
            </div>

            <div class="message" id="message" role="status" aria-live="polite"></div>

            <form id="downloadForm">
                <label for="videoUrl">Video URL</label>
                <div class="input-row">
                    <input type="url" id="videoUrl" name="url"
                           placeholder="https://www.youtube.com/watch?v=…"
                           autocomplete="url" required>
                    <button type="submit" class="primary-button" id="submitBtn">Analyze video</button>
                </div>
            </form>

            <div class="loading" id="loading" aria-live="polite">
                <span class="spinner" aria-hidden="true"></span>
                <span>Reading video details…</span>
            </div>

            <div class="results" id="results"></div>
        </section>

        <p class="local-note">Downloads are processed by this app and saved through your browser.</p>
    </main>

    <script src="/src/assets/js/utils.js"></script>
    <script src="/src/assets/js/api.js"></script>
    <script src="/src/assets/js/ui.js"></script>
    <script src="/src/assets/js/app.js"></script>
</body>
</html>
